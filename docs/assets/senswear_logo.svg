<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#05070E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Pure obsidian luxury squircle container -->
  <rect width="512" height="512" rx="128" fill="#05070E"/>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#1E293B" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Minimalist Luxury Continuous Pulse Loop Glyph -->
  <!-- Ambient Soft Glow Track -->
  <path d="M 152 256 C 152 208 200 208 228 256 L 247 313 L 266 190 L 285 256 C 313 304 360 304 360 256 C 360 208 313 208 285 256 L 266 190 L 247 313 L 228 256 C 200 208 152 208 152 256 Z"
        fill="none"
        stroke="#334155"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.4"/>

  <!-- Primary Foreground Platinum Stroke -->
  <path d="M 152 256 C 152 208 200 208 228 256 L 247 313 L 266 190 L 285 256 C 313 304 360 304 360 256 C 360 208 313 208 285 256 L 266 190 L 247 313 L 228 256 C 200 208 152 208 152 256 Z"
        fill="none"
        stroke="url(#glyphGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Warm Bronze Cardiac Pulse Core -->
  <circle cx="266" cy="190" r="9" fill="url(#bronzeGrad)"/>
</svg>
